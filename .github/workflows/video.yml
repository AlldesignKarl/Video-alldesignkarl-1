name: Generar vídeo con voz realista

on:
  workflow_dispatch:
    inputs:
      voz:
        description: "Voz de Gemini (Kore, Aoede, Leda, Callirrhoe, Charon, Puck...)"
        default: "Kore"
      velocidad:
        description: "Velocidad de la voz (solo Google Cloud / ElevenLabs)"
        default: "0.92"

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install numpy pillow soundfile imageio-ffmpeg

      - name: Comprobar la clave
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Falta el secreto GEMINI_API_KEY en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Generar locución con Gemini
        env:
          MOTOR: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOZ: ${{ inputs.voz }}
          VELOCIDAD: ${{ inputs.velocidad }}
        run: python src/locucion.py

      - name: Renderizar vídeo
        run: python src/render.py

      - name: Guardar vídeo como descarga
        uses: actions/upload-artifact@v4
        with:
          name: reel-ambientador-cachirulo
          path: |
            output/ambientador_cachirulo_reel.mp4
            output/subtitulos.srt

      - name: Subir vídeo al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Reel con voz de Gemini (${{ inputs.voz }})" || echo "Sin cambios"
          git push
